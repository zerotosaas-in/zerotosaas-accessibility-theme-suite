; =========================================================================
; ZeroToSaaS Server Runtime Settings (INI Configuration)
; =========================================================================

[Server]
HostName = 0.0.0.0
PortNumber = 8080
MaxConcurrentClients = 5000
KeepAliveTimeoutSeconds = 60
EnableTls = true
TlsCertificatePath = /etc/ssl/certs/zerotosaas.crt
TlsPrivateKeyPath = /etc/ssl/private/zerotosaas.key

[Database]
Driver = PostgreSQL
Host = db-cluster.prod.internal
Port = 5432
DatabaseName = saas_cluster_db
PoolSize = 64
ConnectionTimeoutMs = 5000

[Security]
MasterSecretKey = sk_live_ini_9941a87b1c3e4492
AllowedOrigins = https://app.zerotosaas.dev,https://admin.zerotosaas.dev
EnableRateLimiting = true
RequestsPerMinute = 1200
SessionExpiryHours = 24

[Telemetry]
EnableMetricsCollection = true
MetricsReportingIntervalSeconds = 15
ExportEndpointUrl = https://telemetry.zerotosaas.dev/v1/metrics
